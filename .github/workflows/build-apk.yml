name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # também permite disparar manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar pacotes do SDK necessários
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build do APK de debug
        run: gradle assembleDebug

      - name: Publicar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: vrar-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
